name: Build LucidRide iOS

on:
  push:
    paths:
      - 'ios/LucidRide/**'
      - '.github/workflows/build-lucidride.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    env:
      # Job-level env so the Appetize steps' `if:` conditions can read these.
      # Both are empty if the secrets aren't set, which makes the steps no-op.
      APPETIZE_API_TOKEN: ${{ secrets.APPETIZE_API_TOKEN }}
      APPETIZE_PUBLIC_KEY: ${{ secrets.APPETIZE_PUBLIC_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "Using: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version
          echo "Available SDKs:"
          xcodebuild -showsdks | grep iphoneos || echo "No iphoneos SDK found"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project from project.yml
        working-directory: ios/LucidRide
        run: |
          xcodegen generate
          ls -la LucidRide.xcodeproj || (echo "xcodegen produced no project!" && exit 1)

      # NOTE: credential injection REMOVED 2026-05-17.
      # The app now reads/writes Supabase directly with the public anon key
      # (scoped server-side RLS policies `lucidride_anon_*`). No email/password
      # is baked into the binary anymore — this permanently closes the
      # public-repo credential-leak problem. Do NOT re-add a sed-injection step.

      - name: Inject commit SHA + build date into BuildInfo.swift
        run: |
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          BUILD_INFO=ios/LucidRide/LucidRide/BuildInfo.swift
          sed -i '' "s|static let commitHash: String = \"local-dev\"|static let commitHash: String = \"${GITHUB_SHA}\"|" "$BUILD_INFO"
          sed -i '' "s|static let buildDate:  String = \"unknown\"|static let buildDate:  String = \"${BUILD_DATE}\"|" "$BUILD_INFO"
          echo "=== BuildInfo.swift after injection ==="
          cat "$BUILD_INFO"

      - name: Inject Spotify Client ID (from secret — placeholder stays for forks)
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
        run: |
          if [ -n "$SPOTIFY_CLIENT_ID" ]; then
            FILE=ios/LucidRide/LucidRide/Services/SpotifyController.swift
            sed -i '' "s|__SPOTIFY_CLIENT_ID__|${SPOTIFY_CLIENT_ID}|" "$FILE"
            echo "Spotify Client ID injected from secret."
          else
            echo "No SPOTIFY_CLIENT_ID secret set — leaving placeholder (e.g. a public fork build)."
          fi

      - name: Build for device (ad-hoc signed with entitlements)
        working-directory: ios/LucidRide
        run: |
          xcodebuild build \
            -project LucidRide.xcodeproj \
            -scheme LucidRide \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath $RUNNER_TEMP/DerivedData \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS=NO \
            SWIFT_VERSION=5.0 \
            CURRENT_PROJECT_VERSION=${GITHUB_RUN_NUMBER} \
            MARKETING_VERSION=1.0.${GITHUB_RUN_NUMBER} \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            EXCLUDED_ARCHS=x86_64 \
            SUPPORTS_MACCATALYST=NO \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            2>&1 | tee build.log || true

          grep -i "error:" build.log || echo "No explicit errors found"
          grep -c "error:" build.log && exit 65 || true

      - name: Verify embedded entitlements
        run: |
          APP_PATH=$(find $RUNNER_TEMP/DerivedData -name "LucidRide.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Could not find LucidRide.app"
            find $RUNNER_TEMP/DerivedData -name "*.app" -type d
            exit 1
          fi
          echo "=== Main app entitlements ==="
          codesign -d --entitlements - "$APP_PATH" 2>&1 | tee main-ent.txt || true
          if ! grep -q "application-groups" main-ent.txt; then
            echo "ERROR: main app missing application-groups entitlement"
            exit 1
          fi
          echo "Entitlements look good."

      - name: Package IPA
        run: |
          APP_PATH=$(find $RUNNER_TEMP/DerivedData -name "LucidRide.app" -type d | head -1)
          echo "Found app at: $APP_PATH"

          xattr -cr "$APP_PATH"

          mkdir -p $RUNNER_TEMP/Payload
          ditto "$APP_PATH" "$RUNNER_TEMP/Payload/LucidRide.app"
          cd $RUNNER_TEMP
          ditto -c -k --sequesterRsrc --keepParent Payload LucidRide.ipa
          echo "IPA size: $(du -h LucidRide.ipa | cut -f1)"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LucidRide-adhoc
          path: ${{ runner.temp }}/LucidRide.ipa
          retention-days: 30

      # NOTE: GitHub Releases are intentionally DISABLED.
      # Reason: this is a PUBLIC repo, and the Inject auth credentials step
      # bakes Supabase user creds into the IPA. A public Release made the IPA
      # discoverable to anyone — a credential leak vector. Distribution goes
      # ONLY through AltStore PAL (Supabase Storage path, obscured URL),
      # NOT through GitHub Releases. Do not re-enable without a sign-in screen.

      - name: Update AltStore Source JSON (merge — preserve other Lucid apps)
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          IPA_SIZE=$(stat -f%z $RUNNER_TEMP/LucidRide.ipa)
          BUILD_DATE_ISO=$(date -u +%Y-%m-%dT%H:%M:%S+00:00)
          STORAGE_BASE_PUBLIC="https://db.speed-running-life.com/storage/v1/object/public/ipa-builds"
          DOWNLOAD_URL="${STORAGE_BASE_PUBLIC}/LucidRide-${RUN_NUMBER}.ipa"

          # Fetch current manifest (has LucidBridge + Health + Foods entries) — fallback to empty
          if curl -fsS "${STORAGE_BASE_PUBLIC}/altstore-source.json" -o /tmp/cur.json; then
            echo "Fetched existing source.json"
          else
            echo "No existing source.json — starting fresh"
            echo '{"name":"Lucid AltStore","identifier":"com.fabi.lucid.altstore","apps":[]}' > /tmp/cur.json
          fi

          # appPermissions shape: AltStore's Codable requires
          #   entitlements: [{name: string}]                     (NOT [string])
          #   privacy:      [{name, usageDescription}]           (NOT {key: desc} dict)
          # The faq.altstore.io docs page is outdated and shows the legacy
          # shape, but the real source decoder rejects the legacy shape with
          # "data isn't in the correct format". See landmines doc.
          NEW_ENTRY=$(cat <<JSONEND
          {
            "name": "Lucid Ride",
            "bundleIdentifier": "com.fabi.lucidride",
            "developerName": "Fabi",
            "localizedDescription": "Body-state-aware motorcycle ride telemetry. HR profile via Supabase JOIN, placeholder tiles for lean angle / GPS / segments / body-state correlation until telemetry hardware is wired.",
            "iconURL": "https://app.lucid-ai.app/icon-512.png",
            "tintColor": "#8B5CF6",
            "screenshotURLs": [],
            "version": "1.0.${RUN_NUMBER}",
            "buildVersion": "${RUN_NUMBER}",
            "versionDate": "${BUILD_DATE_ISO}",
            "versionDescription": "Build ${RUN_NUMBER}",
            "downloadURL": "${DOWNLOAD_URL}",
            "size": ${IPA_SIZE},
            "minOSVersion": "16.0",
            "versions": [{"version":"1.0.${RUN_NUMBER}","buildVersion":"${RUN_NUMBER}","date":"${BUILD_DATE_ISO}","size":${IPA_SIZE},"downloadURL":"${DOWNLOAD_URL}","localizedDescription":"Build ${RUN_NUMBER}","minOSVersion":"16.0"}],
            "appPermissions": {
              "entitlements": [{"name":"com.apple.security.application-groups"}],
              "privacy": [
                {"name":"NSBluetoothAlwaysUsageDescription","usageDescription":"Connects to bike telemetry hardware via BLE."},
                {"name":"NSBluetoothPeripheralUsageDescription","usageDescription":"Connects to bike telemetry hardware via BLE (legacy peripheral key)."},
                {"name":"NSLocationWhenInUseUsageDescription","usageDescription":"Records ride GPS track."},
                {"name":"NSLocationAlwaysAndWhenInUseUsageDescription","usageDescription":"Records ride GPS in background."},
                {"name":"NSMotionUsageDescription","usageDescription":"iPhone IMU fallback for lean angle."},
                {"name":"NSHealthShareUsageDescription","usageDescription":"Reads Watch heart-rate to overlay body state on each ride."},
                {"name":"NSHealthUpdateUsageDescription","usageDescription":"Logs each ride as a workout in Apple Health."}
              ]
            }
          }
          JSONEND
          )

          # Defensive transforms applied to EVERY app entry every build:
          #
          # 1. Strip `marketplaceID` — Bridge and Health CIs in other repos
          #    keep injecting it. AltStore Classic rejects any source with
          #    that field present on any app with "The source contains
          #    notarized apps which are not supported by this version."
          #
          # 2. Convert `appPermissions.entitlements` from [string] to
          #    [{name: string}] if any string entry is found.
          #
          # 3. Convert `appPermissions.privacy` from {key: desc} dict to
          #    [{name: key, usageDescription: desc}] array if it's still
          #    in dict form.
          jq --argjson newApp "$NEW_ENTRY" '
            .apps |= (
              (map(select(.bundleIdentifier != "com.fabi.lucidride")) + [$newApp])
              | map(del(.marketplaceID))
              | map(
                  if (.appPermissions.entitlements? | type) == "array" and ((.appPermissions.entitlements | length) > 0) and ((.appPermissions.entitlements[0] | type) == "string")
                  then .appPermissions.entitlements |= map({name: .})
                  else . end
                )
              | map(
                  if (.appPermissions.privacy? | type) == "object"
                  then .appPermissions.privacy |= ([to_entries[] | {name: .key, usageDescription: .value}])
                  else . end
                )
              | map(
                  if .date != null and .versionDate == null
                  then . + {versionDate: .date} | del(.date)
                  else . end
                )
            )
          ' /tmp/cur.json > /tmp/altstore-source.json

          echo "=== Final source.json apps ==="
          jq '.apps | map({id: .bundleIdentifier, mktID: (.marketplaceID // "absent"), entShape: (.appPermissions.entitlements | if length>0 then (.[0]|type) else "empty" end), privShape: (.appPermissions.privacy | type)})' /tmp/altstore-source.json

      - name: Upload IPA + source.json to Supabase Storage
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          STORAGE_BASE="https://db.speed-running-life.com/storage/v1/object/ipa-builds"

          echo "Uploading altstore-source.json..."
          curl -fsS -X PUT "${STORAGE_BASE}/altstore-source.json" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
            -H "Content-Type: application/json" \
            -H "x-upsert: true" \
            --data-binary @/tmp/altstore-source.json

          echo ""
          echo "Uploading LucidRide-${{ github.run_number }}.ipa (versioned)..."
          curl -fsS -X PUT "${STORAGE_BASE}/LucidRide-${{ github.run_number }}.ipa" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
            -H "Content-Type: application/octet-stream" \
            -H "x-upsert: true" \
            --data-binary @$RUNNER_TEMP/LucidRide.ipa

          echo ""
          echo "Also uploading canonical LucidRide.ipa (back-compat for cached source clients)..."
          curl -fsS -X PUT "${STORAGE_BASE}/LucidRide.ipa" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
            -H "Content-Type: application/octet-stream" \
            -H "x-upsert: true" \
            --data-binary @$RUNNER_TEMP/LucidRide.ipa

          echo ""
          echo "Uploading app icon (512px)..."
          curl -fsS -X PUT "${STORAGE_BASE}/LucidRide-icon-512.png" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
            -H "Content-Type: image/png" \
            -H "x-upsert: true" \
            --data-binary @ios/LucidRide/build-assets/icon-512.png

          echo "Storage upload complete."

      # === Simulator build for browser preview via Appetize.io (free tier) ===
      # Runs only when APPETIZE_API_TOKEN is set in repo secrets.
      # Produces a .app bundle for the iOS Simulator, zips it, uploads to Appetize.
      # First upload returns a publicKey — save that as APPETIZE_PUBLIC_KEY secret
      # so subsequent builds update the same app (keeps the preview URL stable).

      - name: Build for iOS Simulator (Appetize preview)
        if: env.APPETIZE_API_TOKEN != ''
        working-directory: ios/LucidRide
        env:
          APPETIZE_API_TOKEN: ${{ secrets.APPETIZE_API_TOKEN }}
        run: |
          xcodebuild build \
            -project LucidRide.xcodeproj \
            -scheme LucidRide \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath $RUNNER_TEMP/SimulatorBuild \
            -sdk iphonesimulator \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            SWIFT_VERSION=5.0 \
            CURRENT_PROJECT_VERSION=${GITHUB_RUN_NUMBER} \
            MARKETING_VERSION=1.0.${GITHUB_RUN_NUMBER} \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            2>&1 | tee sim-build.log || true

          grep -i "error:" sim-build.log || echo "No explicit sim errors found"

      - name: Zip Simulator .app for Appetize
        if: env.APPETIZE_API_TOKEN != ''
        env:
          APPETIZE_API_TOKEN: ${{ secrets.APPETIZE_API_TOKEN }}
        run: |
          SIM_APP=$(find $RUNNER_TEMP/SimulatorBuild -name "LucidRide.app" -type d | head -1)
          if [ -z "$SIM_APP" ]; then
            echo "WARN: simulator .app not found, skipping Appetize upload"
            echo "APPETIZE_SKIP=1" >> $GITHUB_ENV
            exit 0
          fi
          echo "Found sim app at: $SIM_APP"
          cd "$(dirname "$SIM_APP")"
          ditto -c -k --sequesterRsrc --keepParent LucidRide.app $RUNNER_TEMP/LucidRide-sim.app.zip
          echo "Sim app.zip size: $(du -h $RUNNER_TEMP/LucidRide-sim.app.zip | cut -f1)"

      - name: Upload to Appetize.io (free tier preview)
        if: env.APPETIZE_API_TOKEN != '' && env.APPETIZE_SKIP != '1'
        env:
          APPETIZE_API_TOKEN: ${{ secrets.APPETIZE_API_TOKEN }}
          APPETIZE_PUBLIC_KEY: ${{ secrets.APPETIZE_PUBLIC_KEY }}
        run: |
          if [ -z "$APPETIZE_PUBLIC_KEY" ]; then
            echo "::notice::No APPETIZE_PUBLIC_KEY set — creating a NEW Appetize app. Save the returned publicKey as a GitHub secret."
            RESP=$(curl -fsS \
              --user "${APPETIZE_API_TOKEN}:" \
              -F "file=@$RUNNER_TEMP/LucidRide-sim.app.zip" \
              -F "platform=ios" \
              -F "note=Build ${GITHUB_RUN_NUMBER} — ${GITHUB_SHA}" \
              "https://api.appetize.io/v1/apps")
          else
            echo "Updating existing Appetize app (publicKey: ${APPETIZE_PUBLIC_KEY:0:8}…)"
            RESP=$(curl -fsS \
              --user "${APPETIZE_API_TOKEN}:" \
              -F "file=@$RUNNER_TEMP/LucidRide-sim.app.zip" \
              -F "platform=ios" \
              -F "note=Build ${GITHUB_RUN_NUMBER} — ${GITHUB_SHA}" \
              "https://api.appetize.io/v1/apps/${APPETIZE_PUBLIC_KEY}")
          fi

          echo "Appetize response:"
          echo "$RESP" | head -200

          PUBLIC_KEY=$(echo "$RESP" | sed -nE 's/.*"publicKey"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/p' | head -1)
          if [ -n "$PUBLIC_KEY" ]; then
            APP_URL="https://appetize.io/app/${PUBLIC_KEY}?device=iphone15pro&osVersion=18.0"
            echo "::notice::Preview URL → ${APP_URL}"
            echo "## Appetize Preview" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "🟢 **${APP_URL}**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            if [ -z "$APPETIZE_PUBLIC_KEY" ]; then
              echo "⚠️ **First upload** — copy this publicKey to repo secret \`APPETIZE_PUBLIC_KEY\` so future builds update the same app:" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
              echo "${PUBLIC_KEY}" >> $GITHUB_STEP_SUMMARY
              echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "::warning::Could not parse publicKey from Appetize response"
          fi
