name: Build LucidRide iOS

on:
  push:
    paths:
      - 'ios/LucidRide/**'
      - '.github/workflows/build-lucidride.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "Using: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version
          echo "Available SDKs:"
          xcodebuild -showsdks | grep iphoneos || echo "No iphoneos SDK found"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project from project.yml
        working-directory: ios/LucidRide
        run: |
          xcodegen generate
          ls -la LucidRide.xcodeproj || (echo "xcodegen produced no project!" && exit 1)

      - name: Inject auth credentials
        run: |
          sed -i '' 's|static let prefilledEmail:    String = "BUILD_EMAIL"|static let prefilledEmail:    String = "${{ secrets.EE_TASKS_EMAIL }}"|' \
            ios/LucidRide/LucidRide/Services/SupabaseClient.swift
          sed -i '' 's|static let prefilledPassword: String = "BUILD_PASSWORD"|static let prefilledPassword: String = "${{ secrets.EE_TASKS_PASSWORD }}"|' \
            ios/LucidRide/LucidRide/Services/SupabaseClient.swift
          echo "=== prefilled lines after injection ==="
          grep 'prefilledEmail\|prefilledPassword' ios/LucidRide/LucidRide/Services/SupabaseClient.swift | head -4

      - name: Inject commit SHA + build date into BuildInfo.swift
        run: |
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          BUILD_INFO=ios/LucidRide/LucidRide/BuildInfo.swift
          sed -i '' "s|static let commitHash: String = \"local-dev\"|static let commitHash: String = \"${GITHUB_SHA}\"|" "$BUILD_INFO"
          sed -i '' "s|static let buildDate:  String = \"unknown\"|static let buildDate:  String = \"${BUILD_DATE}\"|" "$BUILD_INFO"
          echo "=== BuildInfo.swift after injection ==="
          cat "$BUILD_INFO"

      - name: Build for device (ad-hoc signed with entitlements)
        working-directory: ios/LucidRide
        run: |
          xcodebuild build \
            -project LucidRide.xcodeproj \
            -scheme LucidRide \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath $RUNNER_TEMP/DerivedData \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS=NO \
            SWIFT_VERSION=5.0 \
            CURRENT_PROJECT_VERSION=${GITHUB_RUN_NUMBER} \
            MARKETING_VERSION=1.0.${GITHUB_RUN_NUMBER} \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            EXCLUDED_ARCHS=x86_64 \
            SUPPORTS_MACCATALYST=NO \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            2>&1 | tee build.log || true

          grep -i "error:" build.log || echo "No explicit errors found"
          grep -c "error:" build.log && exit 65 || true

      - name: Verify embedded entitlements
        run: |
          APP_PATH=$(find $RUNNER_TEMP/DerivedData -name "LucidRide.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Could not find LucidRide.app"
            find $RUNNER_TEMP/DerivedData -name "*.app" -type d
            exit 1
          fi
          echo "=== Main app entitlements ==="
          codesign -d --entitlements - "$APP_PATH" 2>&1 | tee main-ent.txt || true
          if ! grep -q "application-groups" main-ent.txt; then
            echo "ERROR: main app missing application-groups entitlement"
            exit 1
          fi
          echo "Entitlements look good."

      - name: Package IPA
        run: |
          APP_PATH=$(find $RUNNER_TEMP/DerivedData -name "LucidRide.app" -type d | head -1)
          echo "Found app at: $APP_PATH"

          xattr -cr "$APP_PATH"

          mkdir -p $RUNNER_TEMP/Payload
          ditto "$APP_PATH" "$RUNNER_TEMP/Payload/LucidRide.app"
          cd $RUNNER_TEMP
          ditto -c -k --sequesterRsrc --keepParent Payload LucidRide.ipa
          echo "IPA size: $(du -h LucidRide.ipa | cut -f1)"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LucidRide-adhoc
          path: ${{ runner.temp }}/LucidRide.ipa
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lucidride-build-${{ github.run_number }}
          name: "LucidRide build ${{ github.run_number }}"
          body: |
            Build ${{ github.run_number }} — ${{ github.sha }}
          files: ${{ runner.temp }}/LucidRide.ipa
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update AltStore Source JSON (merge — preserve other Lucid apps)
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          IPA_SIZE=$(stat -f%z $RUNNER_TEMP/LucidRide.ipa)
          BUILD_DATE_ISO=$(date -u +%Y-%m-%dT%H:%M:%S+00:00)
          STORAGE_BASE_PUBLIC="https://db.speed-running-life.com/storage/v1/object/public/ipa-builds"
          DOWNLOAD_URL="${STORAGE_BASE_PUBLIC}/LucidRide-${RUN_NUMBER}.ipa"

          # Fetch current manifest (has LucidBridge + Health + Foods entries) — fallback to empty
          if curl -fsS "${STORAGE_BASE_PUBLIC}/altstore-source.json" -o /tmp/cur.json; then
            echo "Fetched existing source.json"
          else
            echo "No existing source.json — starting fresh"
            echo '{"name":"Lucid AltStore","identifier":"com.fabi.lucid.altstore","apps":[]}' > /tmp/cur.json
          fi

          NEW_ENTRY=$(cat <<JSONEND
          {
            "name": "Lucid Ride",
            "bundleIdentifier": "com.fabi.lucidride",
            "developerName": "Fabi",
            "localizedDescription": "Body-state-aware motorcycle ride telemetry. HR profile via Supabase JOIN, placeholder tiles for lean angle / GPS / segments / body-state correlation until telemetry hardware is wired.",
            "iconURL": "https://app.lucid-ai.app/icon-512.png",
            "tintColor": "#8B5CF6",
            "screenshotURLs": [],
            "version": "1.0.${RUN_NUMBER}",
            "buildVersion": "${RUN_NUMBER}",
            "date": "${BUILD_DATE_ISO}",
            "downloadURL": "${DOWNLOAD_URL}",
            "size": ${IPA_SIZE},
            "minOSVersion": "26.0",
            "versions": [{"version":"1.0.${RUN_NUMBER}","buildVersion":"${RUN_NUMBER}","date":"${BUILD_DATE_ISO}","size":${IPA_SIZE},"downloadURL":"${DOWNLOAD_URL}","localizedDescription":"Build ${RUN_NUMBER}","minOSVersion":"26.0"}],
            "appPermissions": {"entitlements":[],"privacy":{"NSBluetoothAlwaysUsageDescription":"Connects to bike telemetry hardware via BLE.","NSLocationWhenInUseUsageDescription":"Records ride GPS track.","NSLocationAlwaysAndWhenInUseUsageDescription":"Records ride GPS in background.","NSMotionUsageDescription":"iPhone IMU fallback for lean angle."}}
          }
          JSONEND
          )

          jq --argjson newApp "$NEW_ENTRY" \
            '.apps |= (map(select(.bundleIdentifier != "com.fabi.lucidride")) + [$newApp])' \
            /tmp/cur.json > /tmp/altstore-source.json

          echo "=== Final source.json apps ==="
          jq '.apps | map(.bundleIdentifier)' /tmp/altstore-source.json

      - name: Upload IPA + source.json to Supabase Storage
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          STORAGE_BASE="https://db.speed-running-life.com/storage/v1/object/ipa-builds"

          echo "Uploading altstore-source.json..."
          curl -fsS -X PUT "${STORAGE_BASE}/altstore-source.json" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
            -H "Content-Type: application/json" \
            -H "x-upsert: true" \
            --data-binary @/tmp/altstore-source.json

          echo ""
          echo "Uploading LucidRide-${{ github.run_number }}.ipa (versioned)..."
          curl -fsS -X PUT "${STORAGE_BASE}/LucidRide-${{ github.run_number }}.ipa" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
            -H "Content-Type: application/octet-stream" \
            -H "x-upsert: true" \
            --data-binary @$RUNNER_TEMP/LucidRide.ipa

          echo ""
          echo "Also uploading canonical LucidRide.ipa (back-compat for cached source clients)..."
          curl -fsS -X PUT "${STORAGE_BASE}/LucidRide.ipa" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
            -H "Content-Type: application/octet-stream" \
            -H "x-upsert: true" \
            --data-binary @$RUNNER_TEMP/LucidRide.ipa

          echo ""
          echo "Uploading app icon (512px)..."
          curl -fsS -X PUT "${STORAGE_BASE}/LucidRide-icon-512.png" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
            -H "Content-Type: image/png" \
            -H "x-upsert: true" \
            --data-binary @ios/LucidRide/build-assets/icon-512.png

          echo "Storage upload complete."
